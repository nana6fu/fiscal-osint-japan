          h += '</div>';
        });
      }
      h += '</div>';
    });
    h += '</div></div>';
  });

  h += '<div style="background:rgba(230,57,70,0.08);border:1px solid #5a2c2c;border-radius:6px;padding:14px 18px;margin-top:16px;">';

  h += '<li><strong style="color:#ffcc66;">NEC の業務対応が完全一致</strong>：経産審議官→Corporate SEVP→デジタル庁¥552.9億 / 関税局長→顧問→財務省¥29億（100%随契LAN）/ 航空管制課長→エアロスペース部門</li>';
  h += '<li><strong style="color:#ffcc66;">全員 2023年（R5年度）入社</strong>：Stage 2 Phase 1（東洋建設・いであ・オオバ）と完全同時期。Phase 1 が氷山の一角だったことが判明</li>';
  h += '</ol></div>';

  h += '<div style="margin-top:14px;font-size:11px;color:#888;line-height:1.6;">📄 <strong>一次資料</strong>：<a href="' + d.source_url + '" target="_blank" style="color:#7ec8ff;">内閣官房内閣人事局 国家公務員法第106条の25第2項に基づく国家公務員の再就職状況の公表（令和5年4月1日～令和6年3月31日分）</a><br>受注データ：各省庁 公共調達適正化情報公表 月次Excel</div>';
  h += '</div>';
